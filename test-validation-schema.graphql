type User {
  id: ID!
  name: String! @size(min = 2, max = 50)
  email: String! @email
  age: Int @range(min = 18, max = 120)
  phone: String @pattern(regexp = "^1[3-9]\\d{9}$", message = "Invalid phone number")
  isActive: Boolean! @assertTrue
  balance: Float @positiveOrZero
  createdAt: String! @notNull
}

input UserInput {
  name: String! @size(min = 2, max = 50)
  email: String! @email
  age: Int @range(min = 18, max = 120)
  phone: String @pattern(regexp = "^1[3-9]\\d{9}$", message = "Invalid phone number")
  isActive: Boolean! @assertTrue
  balance: Float @positiveOrZero
}