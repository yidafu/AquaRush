# Query regions by level and parent code
query GetRegionsByLevelAndParent {
  regions(level: 1, parentCode: "110000") {
    id
    name
    code
    parentCode
    level
    createdAt
    updatedAt
  }
}

# Query all regions (no filters)
query GetAllRegions {
  regions {
    id
    name
    code
    parentCode
    level
    createdAt
    updatedAt
  }
}

# Query root regions (level = 1, no parent code)
query GetRootRegions {
  regions(level: 1) {
    id
    name
    code
    parentCode
    level
    createdAt
    updatedAt
  }
}

# Query child regions by parent code
query GetChildRegions {
  regions(parentCode: "110000") {
    id
    name
    code
    parentCode
    level
    createdAt
    updatedAt
  }
}

# Query provinces (level = 1)
query GetProvinces {
  regions(level: 1) {
    id
    name
    code
    parentCode
    level
    createdAt
    updatedAt
  }
}

# Query cities by province code
query GetCitiesByProvince {
  regions(level: 2, parentCode: "110000") {
    id
    name
    code
    parentCode
    level
    createdAt
    updatedAt
  }
}

# Query districts by city code
query GetDistrictsByCity {
  regions(level: 3, parentCode: "110101") {
    id
