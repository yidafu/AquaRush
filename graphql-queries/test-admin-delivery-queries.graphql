# ==================== 使用示例 ====================

# 1. 查询系统所有管理员
# POST /graphql
# Content-Type: application/json
# Authorization: Bearer <admin_jwt_token>
#
# {
#   "query": "query GetAllTestAdmins { admins { id username realName phone role lastLoginAt createdAt updatedAt } }"
# }

# 2. 查询在线送水工
# POST /graphql
# Content-Type: application/json
# Authorization: Bearer <admin_or_worker_jwt_token>
#
# {
#   "query": "query GetOnlineTestWorkers { onlineDeliveryWorkers { id name phone status totalOrders completedOrders averageRating earning isAvailable } }"
# }

# 3. 查询特定送水工详情
# POST /graphql
# Content-Type: application/json
# Authorization: Bearer <admin_or_worker_jwt_token>
#
# {
#   "query": "query GetWorkerZhang { deliveryWorker(id: 1000000000000000001) { id name phone status totalOrders completedOrders averageRating earning coordinates currentLocation } }",
#   "variables": {
#     "workerId": 1000000000000000001
#   }
# }