# ==================== 综合系统状态查询 ====================

# 查询系统管理员概览
query GetSystemAdminsOverview {
  admins {
    id
    username
    realName
    phone
    role
    lastLoginAt
    createdAt
    updatedAt
  }
}

# 查询送水工团队状态
query GetDeliveryTeamStatus {
  deliveryWorkers {
    id
    name
    phone
    status
    totalOrders
    completedOrders
    averageRating
    earning
    isAvailable
    createdAt
    updatedAt
  }

  onlineDeliveryWorkers {
    id
    name
    phone
    status
    totalOrders
    completedOrders
    averageRating
    earning
    isAvailable
    lastLoginAt
    createdAt
    updatedAt
  }
}

# ==================== 批量查询（使用别名） ====================

# 批量查询所有测试管理员
query GetAllTestAdminsBatch {
  admin1: admin(id: 1) {
    id
    username
    realName
    phone
    role
    lastLoginAt
    createdAt
    updatedAt
  }

  admin2: admin(id: 2) {
    id
    username
    realName
    phone
    role
    lastLoginAt
    createdAt
    updatedAt
  }
}

# 批量查询所有测试送水工
query GetAllTestWorkersBatch {
  worker1: deliveryWorker(id: 1000000000000000001) {
    id
    name
    phone
    status
    totalOrders
    completedOrders
    averageRating
    earning
    isAvailable
    createdAt
    updatedAt
  }

  worker2: deliveryWorker(id: 1000000000000000002) {
    id
    name
    phone
    status
    totalOrders
    completedOrders
    averageRating
    earning
    isAvailable
    createdAt
    updatedAt
  }

  worker3: deliveryWorker(id: 1000000000000000003) {
    id
    name
    phone
    status
    totalOrders
    completedOrders
    averageRating
    earning
    isAvailable
    createdAt
    updatedAt
  }
}

