# GraphQL查询 - 测试数据查询（管理员和送水工）
# 用于查询我们生成的测试数据中的管理员和送水工信息

# ==================== 管理员测试数据查询 ====================

# 查询所有管理员（包含我们创建的2个测试管理员）
query GetAllTestAdmins {
  admins {
    id
    username
    realName
    phone
    role
    lastLoginAt
    createdAt
    updatedAt
  }
}

# 查询超级管理员（用户名：superadmin）
query GetSuperAdmin {
  admin(id: 1) {
    id
    username
    realName
    phone
    role
    lastLoginAt
    createdAt
    updatedAt
  }
}

# 查询普通管理员（用户名：admin）
query GetNormalAdmin {
  admin(id: 2) {
    id
    username
    realName
    phone
    role
    lastLoginAt
    createdAt
    updatedAt
  }
}

# ==================== 送水工测试数据查询 ====================

# 查询所有送水工（包含我们创建的3个测试送水工）
query GetAllTestDeliveryWorkers {
  deliveryWorkers {
    id
    userId
    wechatOpenId
    name
    phone
    avatarUrl
    status
    totalOrders
    completedOrders
    averageRating
    earning
    isAvailable
    createdAt
    updatedAt
  }
}

# 查询在线送水工（张师傅和李师傅）
query GetOnlineTestWorkers {
  onlineDeliveryWorkers {
    id
    userId
    wechatOpenId
    name
    phone
    avatarUrl
    status
    coordinates
    currentLocation
    rating
    totalOrders
    completedOrders
    averageRating
    earning
    isAvailable
    createdAt
    updatedAt
  }
}

