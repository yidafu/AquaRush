# ==================== 完整的 GraphQL 请求示例 ====================

# 示例1：创建地址请求
# Query:
# mutation CreateAddress($province: String!, $city: String!, $district: String!, $detailAddress: String!, $isDefault: Boolean) {
#   createAddress(input: {
#     province: $province
#     city: $city
#     district: $district
#     detailAddress: $detailAddress
#     isDefault: $isDefault
#   }) {
#     id
#     province
#     city
#     district
#     detailAddress
#     isDefault
#     createdAt
#   }
# }
#
# Variables:
# {
#   "province": "浙江省",
#   "city": "杭州市",
#   "district": "上城区",
#   "detailAddress": "某某大厦123号",
#   "isDefault": true
# }

# 示例2：更新地址请求
# Query:
# mutation UpdateUserAddress($id: Long!, $detailAddress: String, $isDefault: Boolean) {
#   updateUserAddress(id: $id, input: {
#     detailAddress: $detailAddress
#     isDefault: $isDefault
#   }) {
#     id
#     detailAddress
#     isDefault
#     updatedAt
#   }
# }
#
# Variables:
# {
#   "id": 1000000000000000001,
#   "detailAddress": "更新后的详细地址",
#   "isDefault": true
# }

# ==================== 权限说明 ====================

# 权限要求：
# - createAddress: 需要用户登录（ isAuthenticated() ）
# - updateUserAddress: 需要用户登录，且只能更新自己的地址
# - deleteUserAddress: 需要用户登录，且只能删除自己的地址
# - deleteUserAddresses: 需要用户登录，且只能删除自己的地址
# - setDefaultUserAddress: 需要用户登录，且只能设置自己的默认地址
# - copyUserAddress: 需要用户登录，且只能复制自己的地址

# 输入验证：
# - province: 必填，不能为空
# - city: 必填，不能为空
# - district: 必填，不能为空
# - detailAddress: 必填，不能为空，长度不能超过200个字符
# - longitude: 可选，经度坐标
# - latitude: 可选，纬度坐标
# - isDefault: 可选，默认为false
# - newName: 复制地址时必填，新地址的名称

# 业务逻辑：
# - 设置默认地址时，会自动取消其他默认地址
# - 复制的地址默认不是默认地址
# - 批量删除最多一次删除10个地址
# - 删除地址前应检查是否有关联的未完成订单（TODO）
# - 所有可能抛出 BadRequestException 的操作都有适当的错误处理
# - 用户最多可以创建20个地址，超出限制将抛出 BadRequestException

# 安全考虑：
# - 所有操作都验证地址所有权
# - 用户只能操作自己的地址
# - 使用 @AuthenticationPrincipal 获取当前用户信息
# - 所有操作都在事务中执行（@Transactional）