# GraphQL Mutations - 客户端地址管理接口
# 基于 ClientAddressMutationResolver 创建的地址管理 GraphQL mutation 接口

# ==================== 创建地址 ====================

# 创建新地址（需要用户登录）
mutation CreateAddress(
  $province: String!
  $provinceCode: String
  $city: String!
  $cityCode: String
  $district: String!
  $districtCode: String
  $detailAddress: String!
    $longitude: Float
  $latitude: Float
  $isDefault: Boolean = false
) {
  createAddress(input: {
    province: $province
    provinceCode: $provinceCode
    city: $city
    cityCode: $cityCode
    district: $district
    districtCode: $districtCode
    detailAddress: $detailAddress
      longitude: $longitude
    latitude: $latitude
    isDefault: $isDefault
  }) {
    id
    userId
    province
    provinceCode
    city
    cityCode
    district
    districtCode
    detailAddress
      longitude
    latitude
    isDefault
    createdAt
    updatedAt
  }
}

# ==================== 更新地址 ====================

# 更新地址信息（需要用户登录）
mutation UpdateUserAddress(
  $id: Long!
  $province: String
  $provinceCode: String
  $city: String
  $cityCode: String
  $district: String
  $districtCode: String
  $detailAddress: String
    $longitude: Float
  $latitude: Float
  $isDefault: Boolean
  $phone: String
  $receiverName: String
) {
  updateUserAddress(
    id: $id
    input: {
      province: $province
      provinceCode: $provinceCode
      city: $city
      cityCode: $cityCode
      district: $district
      districtCode: $districtCode
      detailAddress: $detailAddress
          longitude: $longitude
      latitude: $latitude
      isDefault: $isDefault
      phone: $phone
      receiverName: $receiverName
    }
  ) {
    id
    userId
    province
    provinceCode
    city
    cityCode
    district
    districtCode
    detailAddress
      longitude
    latitude
    isDefault
    createdAt
    updatedAt
  }
}

# ==================== 删除地址 ====================

# 删除单个地址（需要用户登录）
mutation DeleteUserAddress($id: Long!) {
  deleteUserAddress(id: $id)
}

# 批量删除地址（需要用户登录）
mutation DeleteUserAddresses($ids: [Long!]!) {
  deleteUserAddresses(ids: $ids)
}

# ==================== 设置默认地址 ====================

# 设置默认地址（需要用户登录）
mutation SetDefaultUserAddress($id: Long!) {
  setDefaultUserAddress(id: $id)
}

# ==================== 复制地址 ====================

# 复制地址（需要用户登录）
mutation CopyUserAddress(
  $id: Long!
  $newName: String!
) {
  copyUserAddress(
    id: $id
    newName: $newName
  ) {
    id
    userId
    province
    provinceCode
    city
    cityCode
    district
    districtCode
    detailAddress
      longitude
    latitude
    isDefault
    createdAt
    updatedAt
  }
}

