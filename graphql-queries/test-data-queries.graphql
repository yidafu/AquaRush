# 查询张明（用户ID: 1000000000000000011）的完整信息
query GetUserZhangMingComplete {
  user: user(id: 1000000000000000011) {
    id
    wechatOpenId
    nickname
    phone
    avatarUrl
    createdAt
    updatedAt
  }

  orders: ordersByUser(userId: 1000000000000000011) {
    id
    orderNumber
    product {
      id
      name
      price
    }
    address {
      id
      receiverName
      phone
      province
      city
      district
      detailAddress
      isDefault
    }
    quantity
    amount
    status
    paymentMethod
    paymentTime
    deliveryWorker {
      id
      name
      phone
      status
    }
    deliveryPhotos
    completedAt
    createdAt
    updatedAt
  }
}

# 查询陈强（用户ID: 1000000000000000015）的待配送订单
query GetUserChenQiangPendingOrders {
  user: user(id: 1000000000000000015) {
    id
    wechatOpenId
    nickname
    phone
  }

  pendingOrders: ordersByUserAndStatus(userId: 1000000000000000015, status: PENDING) {
    id
    orderNumber
    product {
      id
      name
      price
    }
    address {
      id
      receiverName
      phone
      province
      city
      district
      detailAddress
    }
    quantity
    amount
    status
    createdAt
  }
}

# 获取所有用户的送货地址（需要逐个查询用户对应的地址）
# 地址ID范围：2000000000000000011 到 2000000000000000123

query GetTestUserAddresses {
  address1: address(id: 2000000000000000011) {
    id
    userId
    receiverName
    phone
    province
    city
    district
    detailAddress
    isDefault
    createdAt
    updatedAt
  }

  address2: address(id: 2000000000000000021) {
    id
    userId
    receiverName
    phone
    province
    city
    district
    detailAddress
    isDefault
    createdAt
    updatedAt
  }

  address3: address(id: 2000000000000000031) {
    id
    userId
    receiverName
    phone
    province
    city
    district
    detailAddress
    isDefault
    createdAt
