# GraphQL查询 - 测试数据用户查询
# 用于查询我们生成的测试数据中的用户信息

# 查询当前登录用户
query GetCurrentUser {
  me {
    id
    wechatOpenId
    nickname
    phone
    avatarUrl
    createdAt
    updatedAt
  }
}

