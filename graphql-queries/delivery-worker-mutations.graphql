# ==================== 权限说明 ====================

# 权限要求：
# - createDeliveryWorker: 需要 ROLE_ADMIN 权限
# - updateDeliveryWorker: 需要 ROLE_ADMIN 权限
# - deleteDeliveryWorker: 需要 ROLE_ADMIN 权限

# 输入验证：
# - wechatOpenId: 必填，不能为空
# - name: 必填，不能为空
# - phone: 必填，必须为有效的中国手机号码
# - rating: 可选，不能为负数
# - earning: 可选，不能为负数
# - isAvailable: 可选，默认为 true

# 删除限制：
# - 送水工必须存在
# - 送水工不能有进行中的配送任务

# 重复性检查：
# - 微信OpenID必须唯一
# - 手机号码必须唯一