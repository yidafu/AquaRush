# GraphQL Mutations - 送水工增删改接口
# 新增的送水工管理GraphQL mutation接口

# ==================== 创建送水工 ====================

# 创建新的送水工（需要管理员权限）
mutation CreateDeliveryWorker(
  $wechatOpenId: String!
  $name: String!
  $phone: String!
  $avatarUrl: String
  $coordinates: String
  $currentLocation: String
  $rating: BigDecimal
  $earning: BigDecimal
  $isAvailable: Boolean
) {
  createDeliveryWorker(input: {
    wechatOpenId: $wechatOpenId
    name: $name
    phone: $phone
    avatarUrl: $avatarUrl
    coordinates: $coordinates
    currentLocation: $currentLocation
    rating: $rating
    earning: $earning
    isAvailable: $isAvailable
  }) {
    id
    userId
    wechatOpenId
    name
    phone
    avatarUrl
    status
    coordinates
    currentLocation
    rating
    totalOrders
    completedOrders
    averageRating
    earning
    isAvailable
    createdAt
    updatedAt
  }
}

# ==================== 更新送水工 ====================

# 更新送水工信息（需要管理员权限）
mutation UpdateDeliveryWorker(
  $workerId: Long!
  $wechatOpenId: String
  $name: String
  $phone: String
  $avatarUrl: String
  $coordinates: String
  $currentLocation: String
  $rating: BigDecimal
  $earning: BigDecimal
  $isAvailable: Boolean
) {
  updateDeliveryWorker(
    workerId: $workerId
    input: {
      wechatOpenId: $wechatOpenId
      name: $name
      phone: $phone
      avatarUrl: $avatarUrl
      coordinates: $coordinates
      currentLocation: $currentLocation
      rating: $rating
      earning: $earning
      isAvailable: $isAvailable
    }
  ) {
    id
    userId
    wechatOpenId
    name
    phone
    avatarUrl
    status
    coordinates
    currentLocation
    rating
    totalOrders
    completedOrders
    averageRating
    earning
    isAvailable
    createdAt
    updatedAt
  }
}

# ==================== 删除送水工 ====================

# 删除送水工（需要管理员权限）
mutation DeleteDeliveryWorker($workerId: Long!) {
  deleteDeliveryWorker(workerId: $workerId)
}

# ==================== 批量操作 ====================

# 创建多个送水工
mutation CreateMultipleDeliveryWorkers(
  $workers: [CreateDeliveryWorkerInput!]!
) {
  result1: createDeliveryWorker(input: $workers[0]) {
    id
    name
    phone
    wechatOpenId
    status
    createdAt
  }
  result2: createDeliveryWorker(input: $workers[1]) {
    id
    name
    phone
    wechatOpenId
    status
    createdAt
  }
  result3: createDeliveryWorker(input: $workers[2]) {
    id
    name
    phone
    wechatOpenId
    status
    createdAt
  }
}

