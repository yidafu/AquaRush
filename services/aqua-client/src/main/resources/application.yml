spring:
  application:
    name: aqua-user-service
  web:
    resources:
      add-mappings: true
  mvc:
    throw-exception-if-no-handler-found: true

  datasource:
    # 统计聚合时区统一 Asia/Shanghai(P2-8):PostgreSQL 会话时区显式指定,
    # 与统计域 LocalDate.now(STATS_ZONE) 及 JVM 默认时区(应用入口 TimeZone.setDefault)保持一致,
    # 不依赖部署环境默认时区。
    url: jdbc:postgresql://localhost:5432/aqua_rush?useUnicode=true&characterEncoding=UTF-8&TimeZone=Asia/Shanghai
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 60000
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      validation-timeout: 5000
      leak-detection-threshold: 60000
      pool-name: UserServicePool

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: public
    drop-first: false         # 生产环境必须为 false！
    enabled: false            # Schema is managed by the admin service; client has no db changelog resources

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    # 统计聚合时区统一 Asia/Shanghai(P2-8),与 JDBC 会话时区/应用默认时区一致
    time-zone: Asia/Shanghai
    serialization:
      FAIL_ON_EMPTY_BEANS: false
      INDENT_OUTPUT: true
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false
      FAIL_ON_NULL_FOR_PRIMITIVES: false
    default-property-inclusion: NON_NULL

  # GraphQL configuration
  graphql:
    schema:
      printer:
        enabled: true
      file-extensions: .graphqls
      locations: classpath:graphql/, classpath:shared-config/graphql/
      introspection:
        # schema introspection 默认关(裁决缺陷 #8):本地调试置 GRAPHQL_INTROSPECTION_ENABLED=true
        enabled: ${GRAPHQL_INTROSPECTION_ENABLED:false}
    graphiql:
      # 调试面默认关(裁决缺陷 #8):本地开发置 GRAPHIQL_ENABLED=true 开启 /graphiql
      enabled: ${GRAPHIQL_ENABLED:false}
      path: /graphiql
    path: /graphql

server:
  port: 8080
  servlet:
    context-path:
main:
  allow-bean-definition-overriding: true
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    dev.yidafu.aqua: DEBUG
    # Enhanced logging for request troubleshooting
    dev.yidafu.aqua.security: DEBUG
    dev.yidafu.aqua.exception: DEBUG
    org.jetbrains.exposed: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  security:
    user:
      name: admin
      password: 123456

# Application specific properties
aqua:
  id:
    snowflake:
      machine-id: ${SNOWFLAKE_MACHINE_ID:1}
  wechat:
    app-id: ${WECHAT_APP_ID:your-app-id}
    app-secret: ${WECHAT_APP_SECRET:your-app-secret}
    token: "token"
    aes-key: "string"
    # 微信支付 V3(PRD 04-order.md §F-ORD-005):
    # 测试环境默认假支付自动完成(mock-enabled=true);生产置 WECHAT_PAY_MOCK_ENABLED=false
    # 并配置真实商户参数(商户号/商户私钥路径/证书序列号/APIv3 密钥),密钥不落库;
    # 回调地址 notify-url 需为公网可达的 HTTPS 地址(生产),本地开发用 localhost。
    pay:
      appid: ${WECHAT_PAY_APPID:}
      mchid: ${WECHAT_PAY_MCHID:}
      private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
      merchant-serial-number: ${WECHAT_PAY_MERCHANT_SERIAL_NUMBER:}
      api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
      notify-url: ${WECHAT_PAY_NOTIFY_URL:http://localhost:8080/api/pay/notify}
      mock-enabled: ${WECHAT_PAY_MOCK_ENABLED:true}
  messaging:
    enabled: true
  # Transactional Outbox(spec/tech/design/outbox-messaging.md):
  # 与 admin 共享 outbox_events 表;client 不订阅 payment-expiry-events(仅 admin 处理,
  # R-ORD-04);实例身份取 aqua.mode=client。
  outbox:
    enabled: true
    destinations:
      - order-events
      - payment-events
      - delivery-events
      - user-events
      - notifications-events
      - broadcast-events
  mode: client
  # Default region configuration
  region:
    default-district-code: ${DEFAULT_REGION_DISTRICT_CODE:330106} # 西湖区 by default

# Storage configuration
storage:
  type: LOCAL
  local:
    base-path: ${STORAGE_BASE_PATH:./storage}
    max-file-size: 104857600  # 100MB
    allowed-extensions: [ "jpg", "jpeg", "png", "gif", "bmp", "webp", "mp4", "avi", "mov", "wmv", "flv", "mp3", "wav", "flac", "aac", "pdf", "doc", "docx", "txt", "xls", "xlsx", "csv", "ppt", "pptx", "html", "css", "js", "zip", "rar", "7z", "tar", "gz", "bak", "backup" ]

# JWT configuration
app:
  jwt:
    secret: ${JWT_SECRET:your-jwt-secret-key-change-in-production}
    expiration: 86400 # 24 hours in seconds
    refresh-expiration: 604800 # 7 days in seconds
  debug:
    enabled: ${DEBUG_ENABLED:false} # Enable debug endpoints (should only be true in development)