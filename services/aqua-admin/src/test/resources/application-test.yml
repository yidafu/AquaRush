# 集成测试专用数据源(JPA→Exposed 迁移 P4 收尾)。
#
# 背景:admin 集成测试此前直接连开发库 aqua_rush,各测试类只做「尽力幂等」的种子写入,
# 不清理自己写入的数据(663 admins / 1110 orders 的存量污染),导致测试**不可重复执行**:
# 唯一键冲突(uk_customer_groups_name / admins_username_key)、外键冲突(fk_reviews_order /
# fk_favorites_user / fk_order_items_product)与计数型断言(Products 3 vs 81)全部失真。
#
# 方案:测试 profile 指向独立库 aqua_rush_test,并在每个 Spring 上下文启动时
# drop-first 重建 schema(Liquibase 自动迁移),保证任何一次运行都从空库开始。
# 注意:仅 test profile 生效,不触碰 aqua_rush 开发库。
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/aqua_rush_test?useUnicode=true&characterEncoding=UTF-8&TimeZone=Asia/Shanghai
  liquibase:
    drop-first: true
