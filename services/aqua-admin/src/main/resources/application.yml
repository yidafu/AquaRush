spring:
  application:
    name: aqua-delivery-admin-service
  web:
    resources:
      add-mappings: true
  mvc:
    throw-exception-if-no-handler-found: true

  datasource:
    # 统计聚合时区统一 Asia/Shanghai(P2-8):PostgreSQL 会话时区显式指定,
    # 与统计域 LocalDate.now(STATS_ZONE) 及 JVM 默认时区(应用入口 TimeZone.setDefault)保持一致,
    # 不依赖部署环境默认时区。
    url: jdbc:postgresql://localhost:5432/aqua_rush?useUnicode=true&characterEncoding=UTF-8&TimeZone=Asia/Shanghai
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 60000
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      validation-timeout: 5000
      leak-detection-threshold: 60000
      pool-name: DeliveryAdminServicePool

  liquibase:
    # changelog 已迁移为 liquibase-kotlin 编译期 DSL（Kotlin 类）：
    # 路径即类 FQCN（KotlinCompiledLiquibaseChangeLogParser 反射加载 db.changelog.DbChangelogMaster），
    # parser 经 ServiceLoader 自动注册，无需其他配置。
    change-log: db/changelog/DbChangelogMaster
    default-schema: public
    drop-first: false         # 生产环境必须为 false！
    enabled: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    # 统计聚合时区统一 Asia/Shanghai(P2-8),与 JDBC 会话时区/应用默认时区一致
    time-zone: Asia/Shanghai
    serialization:
      FAIL_ON_EMPTY_BEANS: false
      INDENT_OUTPUT: true
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false
      FAIL_ON_NULL_FOR_PRIMITIVES: false
    default-property-inclusion: NON_NULL

  # GraphQL configuration
  graphql:
    schema:
      printer:
        enabled: true
      file-extensions: .graphqls
      locations: classpath:graphql/, classpath:graphql/modules/, classpath:graphql/inputs/, classpath:graphql/extensions/, classpath:shared-config/graphql/
      introspection:
        # schema introspection 默认关(裁决缺陷 #8):本地调试置 GRAPHQL_INTROSPECTION_ENABLED=true
        enabled: ${GRAPHQL_INTROSPECTION_ENABLED:false}
    graphiql:
      # 调试面默认关(裁决缺陷 #8):本地开发置 GRAPHIQL_ENABLED=true 开启 /graphiql
      enabled: ${GRAPHIQL_ENABLED:false}
      path: /graphiql
    path: /graphql

server:
  port: 9090
  servlet:
    context-path:
main:
  allow-bean-definition-overriding: true
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    liquibase: DEBUG
    org.springframework.boot.autoconfigure.liquibase: DEBUG
    root: INFO
    dev.yidafu.aqua: DEBUG
    # Enhanced logging for request troubleshooting
    dev.yidafu.aqua.security: DEBUG
    dev.yidafu.aqua.exception: DEBUG
    # Spring Security logging
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    # Database access logging(JPA 已下线:数据访问统一走 Exposed JDBC)
    org.springframework.jdbc: DEBUG
    org.jetbrains.exposed: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  security:
    user:
      name: admin
      password: 123456

# Application specific properties
aqua:
  id:
    snowflake:
      machine-id: ${SNOWFLAKE_MACHINE_ID:2} # Different machine ID for delivery service
  # 数据维护(F-SYS-006):日志离线备份文件输出目录
  data-maintenance:
    backup-dir: ${LOG_BACKUP_DIR:./data/log-backup}
  wechat:
    app-id: ${WECHAT_APP_ID:your-app-id}
    app-secret: ${WECHAT_APP_SECRET:your-app-secret}
    token: "token"
    aes-key: "string"
    # 微信支付 V3(PRD 04-order.md §F-ORD-005):
    # 测试环境默认假支付自动完成(mock-enabled=true);生产置 WECHAT_PAY_MOCK_ENABLED=false
    # 并配置真实商户参数(商户号/商户私钥路径/证书序列号/APIv3 密钥),密钥不落库。
    pay:
      appid: ${WECHAT_PAY_APPID:}
      mchid: ${WECHAT_PAY_MCHID:}
      private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
      merchant-serial-number: ${WECHAT_PAY_MERCHANT_SERIAL_NUMBER:}
      api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
      notify-url: ${WECHAT_PAY_NOTIFY_URL:http://localhost:8080/api/pay/notify}
      mock-enabled: ${WECHAT_PAY_MOCK_ENABLED:true}
  messaging:
    enabled: true
  # Transactional Outbox(spec/tech/design/outbox-messaging.md):
  # 与 client 共享 outbox_events 表;admin 订阅全部目的地(含仅 admin 消费的
  # payment-expiry-events,R-ORD-04);实例身份取 aqua.mode=admin。
  outbox:
    enabled: true
    destinations:
      - order-events
      - payment-events
      - payment-expiry-events
      - delivery-events
      - user-events
      - notifications-events
      - broadcast-events
  mode: admin

# Storage configuration
storage:
  type: local
  local:
    base-path: ${STORAGE_BASE_PATH:./data/storage}
    max-file-size: 104857600  # 100MB
    allowed-extensions: [ "jpg", "jpeg", "png", "gif", "bmp", "webp", "mp4", "avi", "mov", "wmv", "flv", "mp3", "wav", "flac", "aac", "pdf", "doc", "docx", "txt", "xls", "xlsx", "csv", "ppt", "pptx", "html", "css", "js", "zip", "rar", "7z", "tar", "gz", "exe", "msi", "sh", "bat", "bak", "backup" ]

# JWT configuration
app:
  jwt:
    secret: ${JWT_SECRET:your-jwt-secret-key-change-in-production}
    expiration: 86400 # 24 hours in seconds
    refresh-expiration: 604800 # 7 days in seconds